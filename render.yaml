services:
  - type: web
    name: qc-studio-2d-blazor
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: QC_PUBLIC_DEMO
        value: "false"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: CVAT_URL
        value: "https://app.cvat.ai"
      - key: GEMINI_API_KEY
        sync: false
      - key: CVAT_ACCESS_TOKEN
        sync: false

