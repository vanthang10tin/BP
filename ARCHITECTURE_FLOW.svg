<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">BP QC Studio — kiến trúc và luồng xử lý</title>
  <desc id="desc">Sơ đồ từ dữ liệu ảnh, nhãn và guideline qua kiểm tra local, Gemini tùy chọn, review người dùng, CVAT và xuất báo cáo.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#2563eb"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#d97706"/></marker>
    <style>
      .bg{fill:#f4f7fb}.title{font:700 38px Arial,sans-serif;fill:#14213d}.subtitle{font:18px Arial,sans-serif;fill:#52627a}.section{font:700 16px Arial,sans-serif;letter-spacing:1.2px;fill:#64748b}.head{font:700 21px Arial,sans-serif;fill:#17243b}.body{font:16px Arial,sans-serif;fill:#34445d}.small{font:14px Arial,sans-serif;fill:#52627a}.tiny{font:13px Arial,sans-serif;fill:#64748b}.node{stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}.edgeBlue{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrowBlue)}.edgeAmber{fill:none;stroke:#d97706;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrowAmber)}.chip{font:700 13px Arial,sans-serif;letter-spacing:.4px}.white{fill:#fff}.number{font:700 14px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1260"/>
  <text x="64" y="67" class="title">BP QC Studio — kiến trúc &amp; luồng hoạt động</text>
  <text x="64" y="101" class="subtitle">Từ bộ ảnh/nhãn/guideline đến review có bằng chứng, CVAT issue và báo cáo</text>

  <text x="64" y="148" class="section">1 · CHUẨN BỊ ĐẦU VÀO</text>
  <rect x="64" y="170" width="340" height="170" rx="16" fill="#fff" stroke="#cbd5e1" class="node"/>
  <circle cx="94" cy="202" r="17" fill="#2563eb"/><text x="94" y="203" class="number">A</text>
  <text x="123" y="209" class="head">Ảnh + nhãn</text>
  <text x="88" y="246" class="body">BBox: JSON + ảnh khớp tên</text>
  <text x="88" y="273" class="body">Segmentation: manifest + ảnh</text>
  <text x="88" y="300" class="body">+ train-ID mask (+ color mask)</text>
  <text x="88" y="324" class="tiny">Profile khai format, class, mapping nếu cần</text>

  <rect x="430" y="170" width="300" height="170" rx="16" fill="#fff" stroke="#cbd5e1" class="node"/>
  <circle cx="460" cy="202" r="17" fill="#0f9f83"/><text x="460" y="203" class="number">B</text>
  <text x="489" y="209" class="head">Guideline</text>
  <text x="454" y="246" class="body">Markdown / text đã duyệt</text>
  <text x="454" y="273" class="body">Dùng làm ngữ cảnh và trích dẫn</text>
  <text x="454" y="300" class="body">Issue giữ lại điều khoản liên quan</text>
  <text x="454" y="324" class="tiny">Có version/hash trong workspace</text>

  <rect x="756" y="170" width="330" height="170" rx="16" fill="#eaf1ff" stroke="#93b4f5" class="node"/>
  <circle cx="786" cy="202" r="17" fill="#2563eb"/><text x="786" y="203" class="number">1</text>
  <text x="815" y="209" class="head">Blazor UI · localhost:5000</text>
  <text x="780" y="246" class="body">Chọn BBox hoặc Segmentation</text>
  <text x="780" y="273" class="body">Upload data, guideline, ảnh/mask</text>
  <text x="780" y="300" class="body">Giới hạn Gemini: 10 mặc định, 50 max</text>
  <text x="780" y="324" class="tiny">Có key → Gemini được chọn sẵn; bỏ chọn = local-only</text>

  <path d="M404 255 H748" class="edgeBlue"/>
  <path d="M730 255 H748" class="edgeBlue"/>

  <text x="64" y="398" class="section">2 · QC API ĐIỀU PHỐI</text>
  <rect x="64" y="422" width="350" height="250" rx="18" fill="#fff" stroke="#8ba2bf" class="node"/>
  <circle cx="98" cy="459" r="19" fill="#334155"/><text x="98" y="460" class="number">2</text>
  <text x="130" y="466" class="head">FastAPI · localhost:8000</text>
  <text x="91" y="510" class="body">• Parse / chuẩn hóa định dạng</text>
  <text x="91" y="541" class="body">• Check geometry, class, mask map</text>
  <text x="91" y="572" class="body">• Rule QC + đối chiếu guideline</text>
  <text x="91" y="603" class="body">• Gom prediction thành issue review</text>
  <rect x="91" y="624" width="294" height="28" rx="14" fill="#eef2f7"/>
  <text x="238" y="643" class="chip" text-anchor="middle" fill="#475569">ẢNH KHÔNG TỰ GỬI CLOUD</text>
  <path d="M920 340 V380 H240 V414" class="edgeBlue"/>

  <rect x="478" y="422" width="380" height="250" rx="18" fill="#e9fbf5" stroke="#69c9aa" class="node"/>
  <circle cx="512" cy="459" r="19" fill="#0f9f83"/><text x="512" y="460" class="number">3</text>
  <text x="544" y="466" class="head">Model local (nếu đang sẵn sàng)</text>
  <text x="505" y="510" class="body">BBox → detector local (YOLO family)</text>
  <text x="505" y="541" class="body">Segmentation → model mask local</text>
  <text x="505" y="572" class="body">So với nhãn/mask tải lên</text>
  <text x="505" y="603" class="body">Phát hiện lệch, thiếu hoặc chưa xác nhận</text>
  <text x="505" y="643" class="tiny">Candidate, không kết luận nhãn sai</text>
  <path d="M414 545 H470" class="edge"/>

  <rect x="922" y="422" width="400" height="250" rx="18" fill="#fff7e8" stroke="#f0bd58" class="node"/>
  <circle cx="956" cy="459" r="19" fill="#d97706"/><text x="956" y="460" class="number">4</text>
  <text x="988" y="466" class="head">Gemini vision · tùy chọn</text>
  <text x="949" y="510" class="body">Key chỉ ở backend/GEMINI_API_KEY.txt</text>
  <text x="949" y="541" class="body">Gửi ảnh ưu tiên + nhãn frame + guideline</text>
  <text x="949" y="572" class="body">Gemini trả box/class/confidence/evidence</text>
  <text x="949" y="603" class="body">Tạo candidate riêng; không sửa nhãn gốc</text>
  <rect x="949" y="624" width="344" height="28" rx="14" fill="#ffedc7"/>
  <text x="1121" y="643" class="chip" text-anchor="middle" fill="#92400e">KHI BẬT: ẢNH + GUIDELINE GỬI GOOGLE</text>
  <path d="M414 568 C620 568 716 455 914 455" class="edgeAmber"/>

  <rect x="1390" y="422" width="346" height="250" rx="18" fill="#eef2ff" stroke="#a5b4fc" class="node"/>
  <circle cx="1424" cy="459" r="19" fill="#6257c8"/><text x="1424" y="460" class="number">5</text>
  <text x="1456" y="466" class="head">Hợp nhất kết quả</text>
  <text x="1418" y="510" class="body">Rule issues + model candidates</text>
  <text x="1418" y="541" class="body">BBox proposals + Gemini issues</text>
  <text x="1418" y="572" class="body">Ưu tiên frame cần review trước</text>
  <text x="1418" y="603" class="body">Gắn model, confidence, guideline</text>
  <text x="1418" y="643" class="tiny">Local và Gemini được ghi nguồn riêng</text>
  <path d="M858 545 H1382" class="edgeBlue"/>
  <path d="M1322 568 H1382" class="edgeAmber"/>

  <text x="64" y="728" class="section">3 · REVIEW CÓ NGƯỜI XÁC NHẬN</text>
  <rect x="64" y="752" width="550" height="225" rx="18" fill="#fff" stroke="#93a3b8" class="node"/>
  <circle cx="100" cy="789" r="19" fill="#2563eb"/><text x="100" y="790" class="number">6</text>
  <text x="133" y="796" class="head">Review · trang 2</text>
  <text x="96" y="840" class="body">Queue frame theo mức độ ưu tiên</text>
  <text x="96" y="871" class="body">Ảnh + nhãn gốc + box/mask + issue</text>
  <text x="96" y="902" class="body">Mở guideline, xem evidence/citation</text>
  <text x="96" y="933" class="body">Reviewer Confirm hoặc Dismiss từng issue</text>
  <path d="M1563 672 V710 H337 V744" class="edgeBlue"/>

  <rect x="700" y="752" width="466" height="225" rx="18" fill="#f0f9ff" stroke="#7dd3fc" class="node"/>
  <circle cx="736" cy="789" r="19" fill="#0284c7"/><text x="736" y="790" class="number">7</text>
  <text x="769" y="796" class="head">CVAT · trả việc review</text>
  <text x="732" y="840" class="body">Đẩy issue đã chọn vào đúng Job/frame</text>
  <text x="732" y="871" class="body">Kèm vị trí bằng chứng + mô tả issue</text>
  <text x="732" y="902" class="body">Cần frame mapping chính xác</text>
  <text x="732" y="933" class="body">CVAT issue hướng dẫn annotator sửa nhãn</text>
  <path d="M614 860 H692" class="edgeBlue"/>

  <rect x="1252" y="752" width="484" height="225" rx="18" fill="#f5f3ff" stroke="#c4b5fd" class="node"/>
  <circle cx="1288" cy="789" r="19" fill="#7c3aed"/><text x="1288" y="790" class="number">8</text>
  <text x="1321" y="796" class="head">Export · trang 3</text>
  <text x="1284" y="840" class="body">Markdown: reviewer report</text>
  <text x="1284" y="871" class="body">CSV: issue register / IoU theo class</text>
  <text x="1284" y="902" class="body">Guideline update draft từ issue Confirm</text>
  <text x="1284" y="933" class="body">Draft phải được duyệt rồi mới kích hoạt</text>
  <path d="M614 925 C810 1010 1130 1010 1244 925" class="edgeBlue"/>

  <rect x="64" y="1030" width="1672" height="155" rx="18" fill="#17243b"/>
  <text x="96" y="1072" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">NGUYÊN TẮC AN TOÀN &amp; CHẤT LƯỢNG</text>
  <circle cx="105" cy="1111" r="7" fill="#34d399"/><text x="124" y="1117" font-family="Arial,sans-serif" font-size="16" fill="#e2e8f0">Không bật Gemini = ảnh ở luồng local; key không đưa lên trình duyệt.</text>
  <circle cx="105" cy="1149" r="7" fill="#fbbf24"/><text x="124" y="1155" font-family="Arial,sans-serif" font-size="16" fill="#e2e8f0">Bật Gemini = ảnh/guideline gửi Google; giới hạn frame để kiểm soát dữ liệu và chi phí.</text>
  <circle cx="930" cy="1111" r="7" fill="#60a5fa"/><text x="949" y="1117" font-family="Arial,sans-serif" font-size="16" fill="#e2e8f0">Model chỉ gợi ý; reviewer là người quyết định nhãn đúng/sai.</text>
  <circle cx="930" cy="1149" r="7" fill="#c4b5fd"/><text x="949" y="1155" font-family="Arial,sans-serif" font-size="16" fill="#e2e8f0">CVAT nhận issue để review, không tự ghi đè annotations.</text>
</svg>
